name: Check Skill Description Length

on:
  pull_request:
    paths:
      - "skills/**/SKILL.md"

jobs:
  check-description-length:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Check skill description length (max 1200 chars)
        run: node scripts/check-skill-description-length.mjs
